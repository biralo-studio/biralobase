name: runtime-images
on:
  workflow_dispatch:
    inputs:
      version:
        description: Immutable prerelease version (for example 0.1.0-alpha.1)
        required: true
permissions:
  contents: read
  packages: write
jobs:
  verify:
    uses: ./.github/workflows/release-checks.yaml
  images:
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Require prerelease version
        env:
          VERSION: ${{ inputs.version }}
        run: '[[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-(alpha|beta|rc)\.[0-9]+$ ]]'
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: RELEASE_VERSION=${{ inputs.version }}
          tags: ghcr.io/biralo-studio/biralobase:${{ inputs.version }}
          provenance: true
          sbom: true
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: builder
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: RELEASE_VERSION=${{ inputs.version }}
          tags: ghcr.io/biralo-studio/biralobase-builder:${{ inputs.version }}
          provenance: true
          sbom: true
