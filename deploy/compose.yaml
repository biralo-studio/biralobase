services:
  biralobase:
    image: ${BIRALOBASE_IMAGE:?Set a pinned runtime image digest}
    init: true
    restart: unless-stopped
    read_only: true
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 3m
    ports:
      - "127.0.0.1:${BIRALOBASE_PORT:-8090}:8090"
    volumes:
      - type: bind
        source: ${BIRALOBASE_RELEASE:?Set an immutable absolute release directory}
        target: /app
        read_only: true
      - data:/var/lib/biralobase
    tmpfs:
      - /tmp:rw,exec,nosuid,size=256m,mode=1777
    environment:
      BIRALOBASE_PUBLIC_URL: ${BIRALOBASE_PUBLIC_URL:?Set the HTTPS origin}
      BIRALOBASE_ADMIN_EMAIL: ${BIRALOBASE_ADMIN_EMAIL:?Set the managed administrator email}
      BIRALOBASE_ADMIN_PASSWORD_FILE: /run/secrets/admin_password
      BIRALOBASE_ENCRYPTION_KEY_FILE: /run/secrets/encryption_key
    secrets:
      - admin_password
      - encryption_key
    healthcheck:
      test: [CMD, biralobase, healthcheck]
      interval: 10s
      timeout: 4s
      retries: 12
      start_period: 60s
volumes:
  data:
secrets:
  admin_password:
    file: ${BIRALOBASE_SECRETS_DIR:?Set the secrets directory}/admin_password
  encryption_key:
    file: ${BIRALOBASE_SECRETS_DIR}/encryption_key
